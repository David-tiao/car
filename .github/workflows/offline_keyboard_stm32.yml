name: Offline keyboard & STM32 simulation acceptance

on:
  pull_request:
    paths:
      - "sim2real/**"
      - "STM32F4/**"
      - "algorithm/car_ws/**"
      - ".github/workflows/offline_keyboard_stm32.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python + GCC + JS (no ROS2 or hardware)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Python / ROS2-independent keyboard mapping + mock chassis
        run: bash algorithm/car_ws/bash/test_keyboard_mapping.sh

      - name: Validate CAR-LINK PTY and STM32 C QR/state-machine gate
        run: bash algorithm/car_ws/bash/test_stm32_fsm_realview.sh

      - name: Prove no test endpoint sends physical motor commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path('sim2real/keyboard_dryrun_chassis.py'),
              Path('sim2real/keyboard_fault_lab.py'),
              Path('sim2real/keyboard_mapping_core.py'),
          ]
          for file in candidates:
              source = file.read_text(encoding='utf-8')
              for forbidden in ('serial.Serial(', 'os.open("/dev/tty', 'create_publisher(Twist, "/cmd_vel"'):
                  assert forbidden not in source, f'{file}: forbidden test hardware entry'
          print('PASS: keyboard mock and fault runner contain no direct physical UART or cmd_vel TX')
          PY

      - name: Upload keyboard offline fault-matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-offline-fault-acceptance
          path: /tmp/car_keyboard_fault_lab/
          if-no-files-found: warn
          retention-days: 14
