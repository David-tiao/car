name: All hardware-free car software acceptance

on:
  pull_request:
    paths:
      - "sim2real/**"
      - "STM32F4/**"
      - "algorithm/car_ws/**"
      - ".github/workflows/offline_keyboard_stm32.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python + GCC + JS (no ROS2 or hardware)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Full 14-category software-only acceptance (300 seeded competition cases)
        run: bash algorithm/car_ws/bash/test_all_offline.sh

      - name: Site doctor and real HTTP four-mode smoke (no ROS2 or hardware)
        run: |
          bash algorithm/car_ws/bash/web.sh doctor
          python3 - <<'PY'
          import json
          import os
          import socket
          import subprocess
          import sys
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              port = sock.getsockname()[1]
          base = "http://127.0.0.1:%s" % port
          env = dict(os.environ, CAR_KEYBOARD_AUTOSTART="0")
          proc = subprocess.Popen([sys.executable, "sim2real/server.py", "--host",
                                   "127.0.0.1", "--port", str(port)], env=env,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          try:
              for _ in range(50):
                  if proc.poll() is not None:
                      raise AssertionError("Sim2Real server exited before readiness")
                  try:
                      with urlopen(base + "/api/build", timeout=0.4) as response:
                          assert response.status == 200
                      break
                  except (URLError, TimeoutError, ConnectionError):
                      time.sleep(0.1)
              else:
                  raise AssertionError("Sim2Real HTTP did not become ready")
              for route in ("/sim", "/test", "/real", "/keyboard",
                            "/api/build", "/api/test/telemetry",
                            "/api/real/telemetry", "/api/keyboard/health"):
                  with urlopen(base + route, timeout=3) as response:
                      assert response.status == 200, route
              for route in ("/api/test/telemetry", "/api/real/telemetry"):
                  with urlopen(base + route, timeout=3) as response:
                      data = json.load(response)
                  assert data.get("online") is False, (route, data)
              command = Request(base + "/api/keyboard/command",
                                data=b"{}", method="POST",
                                headers={"Content-Type":"application/json"})
              try:
                  urlopen(command, timeout=3)
                  raise AssertionError("Real motor command endpoint unexpectedly allowed")
              except HTTPError as error:
                  assert error.code == 403, error.code
              print("PASS: four routes, distinct offline telemetry, keyboard TX disabled")
          finally:
              proc.terminate()
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait()
          PY

      - name: Prove no test endpoint sends physical motor commands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [
              Path('sim2real/keyboard/keyboard_dryrun_chassis.py'),
              Path('sim2real/keyboard/keyboard_fault_lab.py'),
              Path('sim2real/keyboard/keyboard_mapping_core.py'),
          ]
          for file in candidates:
              source = file.read_text(encoding='utf-8')
              for forbidden in ('serial.Serial(', 'os.open("/dev/tty', 'create_publisher(Twist, "/cmd_vel"'):
                  assert forbidden not in source, f'{file}: forbidden test hardware entry'
          print('PASS: keyboard mock and fault runner contain no direct physical UART or cmd_vel TX')
          PY

      - name: Upload keyboard offline fault-matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-full-hardware-free-acceptance
          path: |
            /tmp/car_keyboard_fault_lab/
            /tmp/car_keyboard_offline_analysis/
            /tmp/car_keyboard_offline_replay/
            /tmp/car_offline_full_acceptance/
          if-no-files-found: warn
          retention-days: 14
