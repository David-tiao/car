# SIM ONLY: Nav2 Humble controller for the provisional 0.266 x 0.25 m envelope.
# Never load this configuration on the REAL graph.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["goal_checker", "road_node_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.12
      stateful: true
    # A road graph node defines an XY coordinate, not a required heading.
    # Retain the pose checker above for explicit orientation tasks.
    road_node_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 3.141592653589793
      stateful: false
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.15
      max_vel_x: 0.15
      min_vel_y: -0.15
      max_vel_y: 0.15
      max_vel_theta: 0.50
      min_speed_xy: 0.0
      max_speed_xy: 0.18
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.8
      decel_lim_x: -0.4
      decel_lim_y: -0.4
      decel_lim_theta: -0.8
      vx_samples: 9
      vy_samples: 9
      vtheta_samples: 9
      sim_time: 0.8
      linear_granularity: 0.02
      angular_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.04
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "PathDist", "GoalDist", "Twirling"]
      ObstacleFootprint.scale: 1.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      Twirling.scale: 1.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.01
      footprint: "[[-0.133,-0.125],[-0.133,0.125],[0.133,0.125],[0.133,-0.125]]"
      footprint_padding: 0.01
      track_unknown_space: true
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        # Existing mask includes yellow/work/disk and unknown outside field.
        # /map remains the separate physical map for laser locking.
        map_topic: /keepout_filter_mask
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.05
          obstacle_max_range: 3.8
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.20
        cost_scaling_factor: 15.0
